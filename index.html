<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>Attendance Admin</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#718096;--line:#e7ebf2;--brand:#4f46e5;--brand2:#6366f1;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--side:#0b1020;--shadow:0 12px 35px #10182812}*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.sidebar{position:fixed;z-index:30;inset:0 auto 0 0;width:250px;background:var(--side);color:#fff;padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:6px 10px 25px;font-weight:800;font-size:17px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#818cf8,#4f46e5);display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#aab3c7;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}.nav .ico{width:20px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid #ffffff14;padding-top:14px}.main{margin-left:250px;min-height:100vh}.topbar{height:70px;background:#ffffffdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:20}.menu{display:none;background:none;font-size:22px}.search{display:flex;align-items:center;background:#f1f4f9;border:1px solid transparent;border-radius:10px;padding:0 12px;max-width:360px;width:100%;height:40px}.search input{border:0;outline:0;background:transparent;width:100%;padding:0 8px}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.iconbtn{width:40px;height:40px;border-radius:10px;background:transparent}.avatar{width:36px;height:36px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}.eyebrow{color:var(--brand);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0 0;font-size:28px}.head p{margin:7px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;margin-top:9px}.delta{font-size:12px;margin-top:7px}.up{color:var(--ok)}.down{color:var(--bad)}.dashboard{grid-template-columns:1.5fr 1fr}.card-title{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:800}.card-body{padding:18px}.bars{height:210px;display:flex;align-items:end;gap:12px;padding:10px 4px}.bar-wrap{height:100%;flex:1;display:flex;align-items:end;justify-content:center}.bar{width:70%;max-width:42px;background:linear-gradient(#818cf8,#4f46e5);border-radius:7px 7px 3px 3px;min-height:8px}.bar-label{font-size:11px;color:var(--muted);margin-top:8px}.activity{display:grid;gap:15px}.activity-row{display:flex;gap:11px}.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px}.activity-row b{font-size:13px}.activity-row span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.toolbar{padding:14px 16px;display:flex;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.field{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;outline:none}.field:focus{border-color:var(--brand2);box-shadow:0 0 0 3px #6366f11a}.grow{flex:1;min-width:180px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);font-weight:700;background:#fafbfc}.table tr:hover td{background:#fafbff}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.badge.info{background:#e0e7ff;color:#3730a3}.row-actions{display:flex;gap:6px}.linkbtn{background:none;color:var(--brand);font-weight:700}.empty{text-align:center;padding:45px;color:var(--muted)}.pager{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.formgroup{display:grid;gap:6px}.formgroup.full{grid-column:1/-1}.formgroup label{font-weight:700;font-size:12px}.modal-back{position:fixed;z-index:60;inset:0;background:#080d1bcc;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px #0005}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.close{background:none;font-size:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#312e81,#0b1020 55%)}.loginbox{width:min(430px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 30px 90px #0007}.loginbox h1{margin:14px 0 5px}.loginbox p{color:var(--muted)}.loginbox form{display:grid;gap:13px;margin-top:22px}.loginbox .field{width:100%}.notice{padding:10px 12px;border-radius:9px;background:#eef2ff;color:#3730a3;font-size:12px}.toastroot{position:fixed;z-index:100;right:18px;bottom:18px;display:grid;gap:8px}.toast{background:#111827;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 12px 30px #0003}.toast.ok{border-left:4px solid #22c55e}.toast.bad{border-left:4px solid #ef4444}.mobile-overlay{display:none}.profile{display:flex;gap:10px;align-items:center}.profile small{display:block;color:var(--muted)}.hide{display:none!important}.attendance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.attbox{padding:15px}.attbox strong{display:block;font-size:22px;margin-top:5px}.status-btn{padding:7px 10px;border-radius:8px;font-weight:800;background:#f1f5f9}.status-btn.present{background:#dcfce7;color:#166534}.status-btn.absent{background:#fee2e2;color:#991b1b}.mini{font-size:12px;color:var(--muted)}.settings{grid-template-columns:1fr 1fr}.switch{width:42px;height:24px;border-radius:99px;background:#cbd5e1;padding:3px}.switch.on{background:var(--brand)}.switch i{display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}.switch.on i{transform:translateX(18px)}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.dashboard,.settings{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu{display:block}.topbar{padding:0 14px}.topbar .search{max-width:none}.topbar .search{display:none}.content{padding:18px 14px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:23px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.attendance-grid{grid-template-columns:1fr 1fr}.mobile-overlay{position:fixed;z-index:25;inset:0;background:#0007}.mobile-overlay.show{display:block}.profile div{display:none}}@media(max-width:430px){.stats{grid-template-columns:1fr}.attendance-grid{grid-template-columns:1fr}.top-actions .iconbtn{display:none}}
</style></head>
<body>
<div id="root"></div><div id="toastroot" class="toastroot"></div><div id="modalroot"></div>
<script>
'use strict';
const KEY='attendance-admin-v1';
const seed={role:'Admin',user:{name:'System Admin',email:'admin@example.com'},students:[
{id:1,name:'Aarav Sharma',roll:'01',class:'11',section:'A',contact:'9800000001',status:'Active',attendance:94},
{id:2,name:'Anisha Rai',roll:'02',class:'11',section:'A',contact:'9800000002',status:'Active',attendance:88},
{id:3,name:'Bibek Karki',roll:'03',class:'12',section:'B',contact:'9800000003',status:'Active',attendance:91},
{id:4,name:'Diya Thapa',roll:'04',class:'12',section:'A',contact:'9800000004',status:'Archived',attendance:79}],
teachers:[{id:1,name:'Ramesh Adhikari',email:'ramesh@example.com',contact:'9811111111',classes:'11-A, 12-A',status:'Active'},{id:2,name:'Sita Gurung',email:'sita@example.com',contact:'9811111112',classes:'12-B',status:'Active'}],
classes:[{id:1,name:'11',section:'A',teacher:'Ramesh Adhikari',students:2,status:'Active'},{id:2,name:'12',section:'A',teacher:'Ramesh Adhikari',students:1,status:'Active'},{id:3,name:'12',section:'B',teacher:'Sita Gurung',students:1,status:'Active'}],
users:[{id:1,name:'System Admin',email:'admin@example.com',role:'Admin',status:'Active'},{id:2,name:'Ramesh Adhikari',email:'ramesh@example.com',role:'Teacher',status:'Active'},{id:3,name:'Report Viewer',email:'viewer@example.com',role:'Viewer',status:'Disabled'}],
logs:[{user:'System Admin',action:'Student archived',target:'Diya Thapa',time:'Today, 10:42 AM'},{user:'Ramesh Adhikari',action:'Attendance saved',target:'11-A · Today',time:'Today, 09:18 AM'},{user:'System Admin',action:'Role changed',target:'Report Viewer → Viewer',time:'Yesterday, 04:20 PM'}],attendance:{}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let page='Dashboard',editId=null,attDate=new Date().toISOString().slice(0,10);
const icons={Dashboard:'▦',Students:'♙',Teachers:'♟',Classes:'▤',Attendance:'✓',Reports:'◒',Users:'♙', 'Activity Logs':'◷',Settings:'⚙',Logout:'↪'};
const nav=['Dashboard','Students','Teachers','Classes','Attendance','Reports','Users','Activity Logs','Settings'];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(msg,type='ok'){const e=document.createElement('div');e.className='toast '+type;e.textContent=msg;document.getElementById('toastroot').append(e);setTimeout(()=>e.remove(),2800)}
function shell(){document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar" id="side"><div class="brand"><span class="logo">✓</span>Attendance Admin</div><nav class="nav">${nav.map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${icons[n]}</span>${n}</button>`).join('')}</nav><div class="side-bottom"><button class="nav" style="width:100%"><span class="mini" style="padding:11px 12px">v1.0 · Management Console</span></button></div></aside><div class="mobile-overlay" id="overlay" onclick="closeSide()"></div><main class="main"><header class="topbar"><button class="menu" onclick="toggleSide()">☰</button><div class="search">⌕<input id="globalSearch" placeholder="Search students, teachers..." onkeydown="if(event.key==='Enter')globalSearch()"></div><div class="top-actions"><button class="iconbtn" onclick="toast('No new notifications')">🔔</button><div class="profile"><div class="avatar">SA</div><div><b>${esc(db.user.name)}</b><small>${esc(db.role)}</small></div></div></div></header><section class="content" id="content"></section></main></div>`;render()}
function toggleSide(){document.getElementById('side').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function go(n){if(n==='Logout'){if(confirm('Sign out of the current session?'))login();return}page=n;closeSide();shell()}
function head(title,sub,buttons=''){return `<div class="head"><div><div class="eyebrow">Administration</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function render(){const c=document.getElementById('content');({Dashboard:dashboard,Students:students,Teachers:teachers,Classes:classes,Attendance:attendance,Reports:reports,Users:users,'Activity Logs':logs,Settings:settings}[page])?.(c)}
function dashboard(c){let total=db.students.filter(s=>s.status==='Active').length,present=Math.round(total*.9),rate=total?Math.round(present/total*100):0;c.innerHTML=head('Dashboard','Operational overview and attendance health.',`<button class="btn" onclick="go('Attendance')">✓ Take attendance</button><button class="btn primary" onclick="openForm('student')">+ Add student</button>`)+`<div class="grid stats"><div class="card stat"><div class="stat-top">Students <span>♙</span></div><div class="stat-value">${total}</div><div class="delta up">↑ 8.4% this term</div></div><div class="card stat"><div class="stat-top">Teachers <span>♟</span></div><div class="stat-value">${db.teachers.filter(x=>x.status==='Active').length}</div><div class="delta up">Active staff</div></div><div class="card stat"><div class="stat-top">Classes <span>▤</span></div><div class="stat-value">${db.classes.filter(x=>x.status==='Active').length}</div><div class="delta up">Across all sections</div></div><div class="card stat"><div class="stat-top">Today attendance <span>◒</span></div><div class="stat-value">${rate}%</div><div class="delta ${rate>=90?'up':'down'}">${present} present · ${total-present} absent</div></div></div><br><div class="grid dashboard"><div class="card"><div class="card-title">Attendance trend <span class="mini">Last 7 days</span></div><div class="card-body"><div class="bars">${[87,91,89,94,92,96,rate||90].map((v,i)=>`<div class="bar-wrap"><div style="text-align:center;width:100%"><div class="bar" style="height:${v*1.75}px" title="${v}%"></div><div class="bar-label">${['Mon','Tue','Wed','Thu','Fri','Sat','Today'][i]}</div></div></div>`).join('')}</div></div></div><div class="card"><div class="card-title">Recent activity <button class="linkbtn" onclick="go('Activity Logs')">View all</button></div><div class="card-body activity">${db.logs.slice(0,5).map(x=>`<div class="activity-row"><i class="dot"></i><div><b>${esc(x.action)}</b><span>${esc(x.target)} · ${esc(x.time)}</span></div></div>`).join('')}</div></div></div>`}
function students(c){let q='',status='Active',sort='name';c.innerHTML=head('Students','Manage enrollment, profiles and lifecycle status.',`<button class="btn primary" onclick="openForm('student')">+ Add student</button>`)+`<div class="card"><div class="toolbar"><input class="field grow" id="sq" placeholder="Search name or roll number" oninput="studentTable()"><select class="field" id="sf" onchange="studentTable()"><option>Active</option><option>Archived</option><option>All</option></select><select class="field" id="ss" onchange="studentTable()"><option value="name">Name</option><option value="roll">Roll number</option><option value="attendance">Attendance %</option><option value="status">Status</option></select></div><div id="studentTable"></div></div>`;studentTable()}
function studentTable(){const q=(document.getElementById('sq')?.value||'').toLowerCase(),f=document.getElementById('sf')?.value||'Active',s=document.getElementById('ss')?.value||'name';let a=db.students.filter(x=>(f==='All'||x.status===f)&&(x.name.toLowerCase().includes(q)||x.roll.includes(q)));a.sort((x,y)=>String(x[s]).localeCompare(String(y[s]),undefined,{numeric:true}));document.getElementById('studentTable').innerHTML=a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Roll</th><th>Class</th><th>Contact</th><th>Attendance</th><th>Status</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="mini">${esc(x.section)} section</div></td><td>${esc(x.roll)}</td><td>${esc(x.class)}-${esc(x.section)}</td><td>${esc(x.contact)}</td><td><b>${x.attendance}%</b></td><td><span class="badge ${x.status==='Active'?'ok':'warn'}">${x.status}</span></td><td><div class="row-actions"><button class="linkbtn" onclick="viewStudent(${x.id})">View</button><button class="linkbtn" onclick="openForm('student',${x.id})">Edit</button><button class="linkbtn" onclick="archiveStudent(${x.id})">${x.status==='Active'?'Archive':'Restore'}</button></div></td></tr>`).join('')}</tbody></table></div><div class="pager"><span>${a.length} record(s)</span><span>Efficient client-side filtering · ready for server pagination</span></div>`:`<div class="empty"><div style="font-size:30px">⌕</div><b>No students found.</b><div>Try another search or filter.</div></div>`}
function teachers(c){c.innerHTML=head('Teachers','Manage staff, class assignments and attendance responsibilities.',`<button class="btn primary" onclick="openForm('teacher')">+ Add teacher</button>`)+`<div class="card"><div class="toolbar"><input class="field grow" id="tq" placeholder="Search teacher or email" oninput="teacherTable()"><select class="field" id="tf" onchange="teacherTable()"><option>Active</option><option>Archived</option><option>All</option></select></div><div id="teacherTable"></div></div>`;teacherTable()}
function teacherTable(){let q=(document.getElementById('tq')?.value||'').toLowerCase(),f=document.getElementById('tf')?.value||'Active',a=db.teachers.filter(x=>(f==='All'||x.status===f)&&(x.name.toLowerCase().includes(q)||x.email.toLowerCase().includes(q)));document.getElementById('teacherTable').innerHTML=a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Teacher</th><th>Contact</th><th>Assigned classes</th><th>Status</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="mini">${esc(x.email)}</div></td><td>${esc(x.contact)}</td><td>${esc(x.classes)}</td><td><span class="badge ${x.status==='Active'?'ok':'warn'}">${x.status}</span></td><td><button class="linkbtn" onclick="openForm('teacher',${x.id})">Edit</button> <button class="linkbtn" onclick="archiveTeacher(${x.id})">${x.status==='Active'?'Archive':'Restore'}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No teachers found.</div>`}
function classes(c){c.innerHTML=head('Classes & Sections','Organize sections, assign teachers and open class workflows.',`<button class="btn primary" onclick="openForm('class')">+ Create class</button>`)+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${db.classes.map(x=>`<div class="card"><div class="card-body"><div style="display:flex;justify-content:space-between"><div><div class="eyebrow">Class ${esc(x.name)}</div><h2 style="margin:5px 0">Section ${esc(x.section)}</h2></div><span class="badge ${x.status==='Active'?'ok':'warn'}">${x.status}</span></div><p class="mini">Teacher · ${esc(x.teacher)}</p><p><b>${x.students}</b> enrolled students</p><div class="actions"><button class="btn" onclick="go('Attendance');setTimeout(()=>setAttClass('${x.name}','${x.section}'),0)">Open attendance</button><button class="btn" onclick="openForm('class',${x.id})">Edit</button></div></div></div>`).join('')}</div>`}
function attendance(c){let cls=db.classes.find(x=>x.status==='Active');c.innerHTML=head('Attendance','Record daily attendance with an auditable review step.',`<button class="btn" onclick="markAll('present')">✓ Mark all present</button><button class="btn" onclick="markAll('absent')">× Mark all absent</button><button class="btn primary" onclick="saveAttendance()">Save attendance</button>`)+`<div class="card"><div class="toolbar"><input class="field" type="date" id="adate" value="${attDate}" onchange="attDate=this.value;attendance(document.getElementById('content'))"><select class="field" id="aclass" onchange="loadAttendance()">${db.classes.filter(x=>x.status==='Active').map(x=>`<option value="${x.id}">${esc(x.name)}-${esc(x.section)}</option>`).join('')}</select><span class="notice">Changes are validated and recorded when saved.</span></div><div class="card-body"><div class="attendance-grid"><div class="card attbox">Present<strong id="pc">0</strong></div><div class="card attbox">Absent<strong id="ac">0</strong></div><div class="card attbox">Rate<strong id="ap">0%</strong></div></div><div id="attrows"></div></div></div>`;loadAttendance()}
function loadAttendance(){let cid=+document.getElementById('aclass').value,cl=db.classes.find(x=>x.id===cid),arr=db.students.filter(s=>s.status==='Active'&&s.class===cl.name&&s.section===cl.section),key=attDate+'-'+cid;db.attendance[key] ||= Object.fromEntries(arr.map(s=>[s.id,'present']));document.getElementById('attrows').innerHTML=arr.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Roll</th><th>Current status</th><th>Attendance %</th></tr></thead><tbody>${arr.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.roll)}</td><td><button class="status-btn ${db.attendance[key][s.id]}" onclick="toggleAtt(${s.id},${cid})">${db.attendance[key][s.id]==='present'?'✓ Present':'× Absent'}</button></td><td>${s.attendance}%</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No active students are enrolled in this class.</div>`;updateCounts(arr,key)}
function toggleAtt(id,cid){let k=attDate+'-'+cid;db.attendance[k][id]=db.attendance[k][id]==='present'?'absent':'present';save();loadAttendance()}function markAll(v){let cid=+document.getElementById('aclass').value,k=attDate+'-'+cid;Object.keys(db.attendance[k]||{}).forEach(id=>db.attendance[k][id]=v);save();loadAttendance()}function updateCounts(arr,k){let p=arr.filter(s=>db.attendance[k]?.[s.id]==='present').length,a=arr.length-p;document.getElementById('pc').textContent=p;document.getElementById('ac').textContent=a;document.getElementById('ap').textContent=(arr.length?Math.round(p/arr.length*100):0)+'%'}function setAttClass(n,s){let sel=document.getElementById('aclass');if(sel){let o=[...sel.options].find(x=>x.textContent===n+'-'+s);if(o){sel.value=o.value;loadAttendance()}}}
function saveAttendance(){let cid=+document.getElementById('aclass').value,k=attDate+'-'+cid;if(!db.attendance[k])return toast('Nothing to save','bad');let cl=db.classes.find(x=>x.id===cid),p=Object.values(db.attendance[k]).filter(x=>x==='present').length,total=Object.keys(db.attendance[k]).length;db.logs.unshift({user:db.user.name,action:'Attendance saved',target:`${cl.name}-${cl.section} · ${attDate}`,time:'Just now'});save();toast(`Attendance saved · ${p}/${total} present`)}
function reports(c){c.innerHTML=head('Reports','Analyze attendance by student, class and date range.',`<button class="btn" onclick="toast('Report export is ready for server-side CSV/PDF integration')">Export report</button>`)+`<div class="card"><div class="toolbar"><select class="field"><option>All classes</option>${db.classes.map(x=>`<option>${x.name}-${x.section}</option>`).join('')}</select><input class="field" type="date"><input class="field" type="date"><select class="field"><option>All attendance</option><option>Present</option><option>Absent</option></select></div><div class="card-body"><div class="grid stats"><div class="card stat"><div class="stat-top">Average attendance</div><div class="stat-value">90%</div><div class="delta up">Healthy range</div></div><div class="card stat"><div class="stat-top">At-risk students</div><div class="stat-value">2</div><div class="delta down">Below 80%</div></div><div class="card stat"><div class="stat-top">Days recorded</div><div class="stat-value">18</div><div class="delta up">This month</div></div><div class="card stat"><div class="stat-top">Corrections</div><div class="stat-value">3</div><div class="delta">Audited changes</div></div></div><br><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Class</th><th>Attendance</th><th>Risk</th></tr></thead><tbody>${db.students.filter(x=>x.status==='Active').map(x=>`<tr><td>${esc(x.name)}</td><td>${x.class}-${x.section}</td><td>${x.attendance}%</td><td><span class="badge ${x.attendance<80?'bad':'ok'}">${x.attendance<80?'Needs attention':'On track'}</span></td></tr>`).join('')}</tbody></table></div></div></div>`}
function users(c){c.innerHTML=head('Users & Roles','Control system access with role-based authorization.',`<button class="btn primary" onclick="openForm('user')">+ Invite user</button>`)+`<div class="card"><div class="toolbar"><input class="field grow" id="uq" placeholder="Search name or email" oninput="userTable()"></div><div id="userTable"></div></div>`;userTable()}
function userTable(){let q=(document.getElementById('uq')?.value||'').toLowerCase(),a=db.users.filter(x=>(x.name+x.email).toLowerCase().includes(q));document.getElementById('userTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="mini">${esc(x.email)}</div></td><td><span class="badge info">${x.role}</span></td><td><span class="badge ${x.status==='Active'?'ok':'warn'}">${x.status}</span></td><td><button class="linkbtn" onclick="openForm('user',${x.id})">Edit</button> <button class="linkbtn" onclick="toggleUser(${x.id})">${x.status==='Active'?'Disable':'Enable'}</button></td></tr>`).join('')}</tbody></table></div>`}
function logs(c){c.innerHTML=head('Activity Logs','Immutable-style audit view of important administrative actions.',`<button class="btn" onclick="toast('Logs are retained by the protected data layer in production')">Audit policy</button>`)+`<div class="card"><div class="toolbar"><input class="field grow" id="lq" placeholder="Search action, user or target" oninput="logTable()"><select class="field" id="lf" onchange="logTable()"><option>All actions</option><option>Student</option><option>Attendance</option><option>User</option></select></div><div id="logTable"></div></div>`;logTable()}
function logTable(){let q=(document.getElementById('lq')?.value||'').toLowerCase(),f=document.getElementById('lf')?.value||'All actions',a=db.logs.filter(x=>(x.user+x.action+x.target).toLowerCase().includes(q)&&(f==='All actions'||x.action.toLowerCase().includes(f.toLowerCase())));document.getElementById('logTable').innerHTML=a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Action</th><th>Target</th><th>Timestamp</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.user)}</td><td><b>${esc(x.action)}</b></td><td>${esc(x.target)}</td><td>${esc(x.time)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No activity found.</div>`}
function settings(c){c.innerHTML=head('Settings','System preferences and security posture.')+`<div class="grid settings"><div class="card"><div class="card-title">Security</div><div class="card-body"><div style="display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)"><div><b>Protected application</b><div class="mini">Authentication and authorization must be enforced by the backend/data layer.</div></div><span class="badge ok">Required</span></div><div style="display:flex;justify-content:space-between;gap:20px;padding:12px 0"><div><b>Audit sensitive actions</b><div class="mini">Attendance corrections, role changes and lifecycle actions are logged.</div></div><button class="switch on" onclick="this.classList.toggle('on')"><i></i></button></div></div></div><div class="card"><div class="card-title">Data lifecycle</div><div class="card-body"><div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>Archive before delete</b><div class="mini">Important records stay recoverable instead of being immediately destroyed.</div></div><div style="padding:12px 0"><b>Archived records</b><div class="mini">Use the Archived filter in Students and Teachers to retrieve deactivated records.</div></div></div></div><div class="card"><div class="card-title">Application</div><div class="card-body"><div class="notice">Demo persistence is stored locally in this browser. For production, connect the protected Supabase schema included in this repository and enforce RLS/role checks server-side.</div><br><button class="btn danger" onclick="resetDemo()">Reset demo data</button></div></div></div>`}
function resetDemo(){if(confirm('Reset all local demo data? This cannot be undone.')){localStorage.removeItem(KEY);db=JSON.parse(JSON.stringify(seed));save();toast('Demo data reset');render()}}
function modal(title,body,foot){document.getElementById('modalroot').innerHTML=`<div class="modal-back show" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><b>${title}</b><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`}function closeModal(){document.getElementById('modalroot').innerHTML=''}
function openForm(type,id){editId=id||null;let x=id?(type==='student'?db.students:type==='teacher'?db.teachers:type==='class'?db.classes:db.users).find(a=>a.id===id):{};let body='';if(type==='student')body=`<form id="form" class="formgrid" onsubmit="submitForm(event,'student')"><div class="formgroup"><label>Full name *</label><input class="field" name="name" required value="${esc(x.name||'')}"></div><div class="formgroup"><label>Roll number *</label><input class="field" name="roll" required value="${esc(x.roll||'')}"></div><div class="formgroup"><label>Class *</label><input class="field" name="class" required value="${esc(x.class||'11')}"></div><div class="formgroup"><label>Section *</label><input class="field" name="section" required value="${esc(x.section||'A')}"></div><div class="formgroup"><label>Contact</label><input class="field" name="contact" pattern="[0-9+ -]{7,20}" value="${esc(x.contact||'')}"></div><div class="formgroup"><label>Status</label><select class="field" name="status"><option ${x.status!=='Archived'?'selected':''}>Active</option><option ${x.status==='Archived'?'selected':''}>Archived</option></select></div></form>`;if(type==='teacher')body=`<form id="form" class="formgrid" onsubmit="submitForm(event,'teacher')"><div class="formgroup"><label>Teacher name *</label><input class="field" name="name" required value="${esc(x.name||'')}"></div><div class="formgroup"><label>Email *</label><input class="field" name="email" type="email" required value="${esc(x.email||'')}"></div><div class="formgroup"><label>Contact</label><input class="field" name="contact" value="${esc(x.contact||'')}"></div><div class="formgroup"><label>Assigned classes</label><input class="field" name="classes" placeholder="11-A, 12-B" value="${esc(x.classes||'')}"></div></form>`;if(type==='class')body=`<form id="form" class="formgrid" onsubmit="submitForm(event,'class')"><div class="formgroup"><label>Class *</label><input class="field" name="name" required value="${esc(x.name||'11')}"></div><div class="formgroup"><label>Section *</label><input class="field" name="section" required value="${esc(x.section||'A')}"></div><div class="formgroup"><label>Assigned teacher *</label><input class="field" name="teacher" required value="${esc(x.teacher||'')}"></div><div class="formgroup"><label>Status</label><select class="field" name="status"><option>Active</option><option>Archived</option></select></div></form>`;if(type==='user')body=`<form id="form" class="formgrid" onsubmit="submitForm(event,'user')"><div class="formgroup"><label>Full name *</label><input class="field" name="name" required value="${esc(x.name||'')}"></div><div class="formgroup"><label>Email *</label><input class="field" name="email" type="email" required value="${esc(x.email||'')}"></div><div class="formgroup"><label>Role *</label><select class="field" name="role">${['Admin','Teacher','Viewer'].map(r=>`<option ${x.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="formgroup"><label>Status</label><select class="field" name="status"><option>Active</option><option>Disabled</option></select></div></form>`;modal((id?'Edit ':'Add ')+type,body,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" form="form">Save</button>`)}
function submitForm(e,type){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());if(!o.name)return toast('Name is required','bad');let arr=type==='student'?db.students:type==='teacher'?db.teachers:type==='class'?db.classes:db.users;if(type==='student'&&arr.some(x=>x.roll===o.roll&&x.class===o.class&&x.id!==editId))return toast('That roll number already exists in this class.','bad');if(type==='user'&&arr.some(x=>x.email.toLowerCase()===o.email.toLowerCase()&&x.id!==editId))return toast('A user with this email already exists.','bad');if(editId){let x=arr.find(a=>a.id===editId);Object.assign(x,o);db.logs.unshift({user:db.user.name,action:`${type[0].toUpperCase()+type.slice(1)} updated`,target:o.name,time:'Just now'})}else{let n={id:Date.now(),...o};if(type==='student')n.attendance=0;if(type==='class')n.students=0;arr.unshift(n);db.logs.unshift({user:db.user.name,action:`${type[0].toUpperCase()+type.slice(1)} created`,target:o.name,time:'Just now'})}save();closeModal();toast(`${type[0].toUpperCase()+type.slice(1)} saved successfully.`);render()}
function archiveStudent(id){let x=db.students.find(a=>a.id===id);let next=x.status==='Active'?'Archived':'Active';if(!confirm(`${next==='Archived'?'Archive':'Restore'} ${x.name}? ${next==='Archived'?'The record will remain retrievable in Archived.':'The student will become active again.'}`))return;x.status=next;db.logs.unshift({user:db.user.name,action:`Student ${next.toLowerCase()}`,target:x.name,time:'Just now'});save();toast(`Student ${next.toLowerCase()}.`);studentTable()}
function archiveTeacher(id){let x=db.teachers.find(a=>a.id===id);let next=x.status==='Active'?'Archived':'Active';if(!confirm(`${next} ${x.name}?`))return;x.status=next;db.logs.unshift({user:db.user.name,action:`Teacher ${next.toLowerCase()}`,target:x.name,time:'Just now'});save();teacherTable()}
function toggleUser(id){let x=db.users.find(a=>a.id===id);if(x.id===db.user.id)return toast('You cannot disable the current administrator.','bad');x.status=x.status==='Active'?'Disabled':'Active';db.logs.unshift({user:db.user.name,action:`User ${x.status.toLowerCase()}`,target:x.name,time:'Just now'});save();userTable();toast('User status updated.')}
function viewStudent(id){let x=db.students.find(a=>a.id===id);modal('Student profile',`<div class="grid" style="gap:14px"><div><div class="eyebrow">Student</div><h2 style="margin:4px 0">${esc(x.name)}</h2><div class="mini">Roll ${esc(x.roll)} · Class ${esc(x.class)}-${esc(x.section)}</div></div><div class="grid stats"><div class="card stat"><div class="stat-top">Overall attendance</div><div class="stat-value">${x.attendance}%</div></div><div class="card stat"><div class="stat-top">Status</div><div class="stat-value" style="font-size:18px">${x.status}</div></div></div><div><b>Contact</b><p class="mini">${esc(x.contact||'Not provided')}</p></div><div><b>Attendance history</b><p class="mini">Daily records are shown here once connected to the protected attendance data layer. Corrections remain audited.</p></div></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();openForm('student',${id})">Edit</button><button class="btn danger" onclick="closeModal();archiveStudent(${id})">${x.status==='Active'?'Archive':'Restore'}</button>`)}
function globalSearch(){let q=document.getElementById('globalSearch').value.trim();if(!q)return;page='Students';shell();document.getElementById('sq').value=q;studentTable()}
function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">✓</div><h1>Attendance Admin</h1><p>Secure management console for students, staff and attendance.</p><div class="notice">Demo mode: data persists in this browser. Production authentication and RLS belong in the protected backend layer.</div><form onsubmit="event.preventDefault();sessionStorage.setItem('attendance-session','1');shell()"><label>Email</label><input class="field" type="email" required value="admin@example.com"><label>Password</label><input class="field" type="password" required value="demo-password"><button class="btn primary" type="submit">Sign in</button></form></div></div>`}
if(sessionStorage.getItem('attendance-session'))shell();else login();
</script></body></html>
