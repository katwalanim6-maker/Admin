<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Universal Control Panel</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#eef1f7}*{box-sizing:border-box}body{margin:0}.demo{max-width:1500px;margin:0 auto;padding:28px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.intro h1{margin:0;font-size:28px}.intro p{margin:6px 0 0;color:#69758a}.pill{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #e1e6ef;color:#59657a;font-size:12px;font-weight:700}@media(max-width:650px){.demo{padding:12px}.intro{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="demo">
    <div class="intro">
      <div><h1>Universal Control Panel</h1><p>This page is only a demo host. The panel itself is the reusable component.</p></div>
      <span class="pill">v1.0 · dependency-free</span>
    </div>
    <div id="panel"></div>
  </div>
  <script src="./universal-admin-panel.js"></script>
  <script>
    UniversalAdminPanel.mount('#panel', {
      brand: 'My Project',
      subtitle: 'Management Console',
      logo: '◆',
      accent: '#5b5bd6',
      user: { name: 'Project Admin', role: 'Administrator' },
      navigation: [
        { id: 'dashboard', label: 'Dashboard', icon: '⌂' },
        { id: 'members', label: 'Members', icon: '♙' },
        { id: 'projects', label: 'Projects', icon: '▤' },
        { id: 'reports', label: 'Reports', icon: '◒' },
        { id: 'activity', label: 'Activity Logs', icon: '◷' },
        { id: 'settings', label: 'Settings', icon: '⚙' }
      ],
      stats: [
        { label: 'Total Records', value: '1,248', note: '+8.4% this month', icon: '↗' },
        { label: 'Active', value: '1,106', note: '88.6% of records', icon: '✓' },
        { label: 'Pending', value: '74', note: 'Needs attention', icon: '!' },
        { label: 'Archived', value: '68', note: 'Stored safely', icon: '◫' }
      ],
      activity: [
        { action: 'Record updated', meta: 'Project Admin · 12 minutes ago' },
        { action: 'New member added', meta: 'Project Admin · 38 minutes ago' },
        { action: 'Report generated', meta: 'Manager · 1 hour ago' }
      ],
      actions: [
        { label: 'Export', onClick: () => alert('Export action from the host project.') },
        { label: 'Add Record', primary: true, onClick: () => alert('Add action from the host project.') }
      ],
      content: ({ page, item }) => {
        if (page === 'dashboard') return null;
        return `<div class="card" style="background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:40px;text-align:center;color:#748096"><strong style="display:block;color:#182033;margin-bottom:6px">${item.label}</strong>This module is supplied by the project using the panel.</div>`;
      }
    }).on('panel:navigate', event => console.log('Panel navigation:', event.detail.id));
  </script>
</body>
</html>
