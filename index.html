<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A reusable, dependency-free administrative control panel.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Universal Admin Panel</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}.demo{max-width:1500px;margin:0 auto;padding:32px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px}.intro h1{margin:0;font-size:28px;letter-spacing:-.02em}.intro p{max-width:680px;margin:7px 0 0;color:#667085;line-height:1.55}.links{display:flex;gap:14px;flex-wrap:wrap}.links a{color:#344054;text-decoration:none;font-size:13px;font-weight:700}.links a:hover{text-decoration:underline}@media(max-width:650px){.demo{padding:16px}.intro{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="demo">
    <div class="intro">
      <div>
        <h1>Universal Admin Panel</h1>
        <p>A reusable administrative interface for projects that supply their own authentication, data and business rules.</p>
      </div>
      <nav class="links" aria-label="Legal">
        <a href="./privacy.html">Privacy</a>
        <a href="./terms.html">Terms</a>
      </nav>
    </div>
    <div id="panel"></div>
  </main>
  <script src="./universal-admin-panel.js"></script>
  <script>
    UniversalAdminPanel.mount('#panel', {
      brand: 'Admin',
      subtitle: 'Control Panel',
      logo: 'UA',
      accent: '#1f5f8b',
      user: { name: 'Project Admin', role: 'Administrator' },
      navigation: [
        { id: 'dashboard', label: 'Dashboard', icon: 'D' },
        { id: 'members', label: 'Members', icon: 'M' },
        { id: 'projects', label: 'Projects', icon: 'P' },
        { id: 'reports', label: 'Reports', icon: 'R' },
        { id: 'activity', label: 'Activity Logs', icon: 'A' },
        { id: 'settings', label: 'Settings', icon: 'S' }
      ],
      stats: [],
      activity: [],
      actions: [],
      content: ({ page }) => {
        if (page === 'dashboard') return null;
        return `<div class="card" style="background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:40px;text-align:center;color:#667085"><strong style="display:block;color:#172033;margin-bottom:6px">${page}</strong>This module is supplied by the host project.</div>`;
      }
    });
  </script>
</body>
</html>
